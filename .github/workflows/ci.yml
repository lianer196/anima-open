name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no vocabulary)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m anima_open --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check anima_open tools tests

  guard:
    # Fail the build if a data artefact or upstream blob is ever committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject binary / model / vocabulary artefacts
        run: |
          bad=$(git ls-files | grep -Ei '\.(npug|dla|tflite|safetensors|gguf|bin|apk|dex|jar|so|pem)$' || true)
          if [ -n "$bad" ]; then
            echo "refusing to build: artefact files tracked:"; echo "$bad"; exit 1
          fi
          if [ -f tests/vocab.json ] || [ -f tests/merges.txt ]; then
            echo "refusing to build: tokenizer vocabulary must not be committed"; exit 1
          fi
          echo "clean"
