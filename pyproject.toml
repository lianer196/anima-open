[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-open"
version = "0.1.0"
description = "Clean-room tokenisation and LCM scheduling for on-device diffusion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "lianer196" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/lianer196/anima-open"

[tool.setuptools]
packages = ["anima_open"]

[tool.ruff]
line-length = 100
target-version = "py310"
